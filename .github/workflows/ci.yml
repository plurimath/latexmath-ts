name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        node: ['22.0.0', 24]
        # npm bundled with Node 22.0.0 fails before running on the Windows
        # image's global prefix; test the current Node 22 line there.
        exclude:
          - os: windows-latest
            node: '22.0.0'
        include:
          - os: windows-latest
            node: 22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts
      - run: npm run check:artifacts
      - run: npm run build
      - run: npm test
      - uses: actions/checkout@v4
        with:
          repository: plurimath/plurimath-testsuite
          ref: 9767c37a8d7bb21a0694780ecfcbc4f1fbd9eb39
          path: .corpus
      # Latex generation 4, replayed raw-tree (139 rows) and typed-model (247 rows: generation 3's 139 plus 108 -r2 rows).
      # The pin checks the generation digest, payload checksums and the
      # executed row IDs of both boundaries; every row must match.
      - name: Verify ledger and replay generation 4 (raw-tree and typed-model)
        shell: bash
        run: >
          npm run test:corpus -- .corpus --pin corpus-pin.json
          --report "$RUNNER_TEMP/replay-4.json" --executed "$RUNNER_TEMP/executed-4.txt"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: latex-generation-4-${{ matrix.os }}-node${{ matrix.node }}
          path: ${{ runner.temp }}/replay-4.json
          if-no-files-found: ignore
      - run: npm pack --ignore-scripts
  # Install the packed tarball into a clean consumer and parse through the
  # package specifier on the oldest supported and the current Node.
  packed-node:
    strategy:
      fail-fast: false
      matrix:
        node: ['22.0.0', 24]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts
      - run: npm run build
      - name: Install the tarball into a clean consumer and parse
        run: |
          node --version
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/consumer"
          cp scripts/check-packed-node.mjs "$RUNNER_TEMP/consumer/"
          cd "$RUNNER_TEMP/consumer"
          echo '{"name":"consumer","private":true,"type":"module"}' > package.json
          npm install --no-audit --no-fund ../plurimath-latexmath-ts-*.tgz
          node check-packed-node.mjs
